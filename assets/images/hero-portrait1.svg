<svg viewBox="0 0 900 1200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldLight" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D9B56D" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#160D1B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09070B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="silhouetteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24142D"/>
      <stop offset="100%" stop-color="#0E0812"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B56D" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#D9B56D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9829B" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Depth -->
  <rect width="900" height="1200" fill="#09070B"/>
  <rect width="900" height="1200" fill="url(#goldLight)"/>

  <!-- Subtle Editorial Frame -->
  <rect x="30" y="30" width="840" height="1140" fill="none" stroke="url(#goldBorder)" stroke-width="1.5"/>

  <!-- Elegant Editorial Silhouette & Lighting -->
  <circle cx="500" cy="380" r="160" fill="#24142D" opacity="0.6"/>
  
  <!-- Stylized Portrait Silhouette -->
  <path d="M 450 320 C 420 320, 390 350, 390 410 C 390 470, 420 520, 470 540 C 420 560, 340 600, 310 700 C 300 730, 300 850, 300 950 L 650 950 C 650 850, 640 730, 620 700 C 580 590, 500 550, 470 540 C 520 520, 550 470, 550 410 C 550 350, 500 320, 450 320 Z" 
        fill="url(#silhouetteGrad)" stroke="rgba(217, 181, 109, 0.3)" stroke-width="1.5"/>

  <!-- Rim Light on Hair/Profile -->
  <path d="M 400 360 C 400 330, 430 325, 460 325 C 510 325, 545 360, 545 420 C 545 470, 520 515, 480 535" 
        fill="none" stroke="#D9B56D" stroke-width="3" filter="url(#softGlow)" opacity="0.85"/>
</svg>
