<svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad-2022" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#C9829B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#160D1B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#09070B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="border-2022" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9829B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="rgba(245, 239, 229, 0.05)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#09070B"/>
  <rect width="800" height="600" fill="url(#grad-2022)"/>

  <!-- Vintage border styling -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="url(#border-2022)" stroke-width="1.5" rx="8"/>

  <!-- Subtle star watermark -->
  <circle cx="400" cy="270" r="140" fill="none" stroke="#C9829B" stroke-width="1" stroke-dasharray="3 6" opacity="0.25"/>

  <!-- Year watermark -->
  <text x="400" y="320" text-anchor="middle" fill="#C9829B" font-family="'Cormorant Garamond', serif" font-size="120" font-weight="300" opacity="0.2">2022</text>

  <!-- Editorial typography -->
  <g transform="translate(400, 430)">
    <text x="0" y="0" text-anchor="middle" fill="#F5EFE5" font-family="'Cormorant Garamond', serif" font-size="28" font-weight="600" letter-spacing="4">THE TURNING POINT</text>
    <text x="0" y="30" text-anchor="middle" fill="#A9A0A8" font-family="'Manrope', sans-serif" font-size="14" letter-spacing="1.5">The year friendship became an unforgettable story.</text>
    <text x="0" y="65" text-anchor="middle" fill="#C9829B" font-family="'Manrope', sans-serif" font-size="11" letter-spacing="3" opacity="0.8">MEMORY ARTIFACT // 2022</text>
  </g>
</svg>